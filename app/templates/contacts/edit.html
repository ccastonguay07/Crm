{% extends "base.html" %}
{% block title %}Edit {{ contact.full_name }} – Personal CRM{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="/contacts/{{ contact.id }}" class="text-sm text-gray-400 hover:text-gray-600">← {{ contact.full_name }}</a>
</div>

<div class="max-w-2xl">
  <h1 class="text-2xl font-bold mb-6">Edit Contact</h1>
  <form method="post" action="/contacts/{{ contact.id }}/edit" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% set c = contact %}
    {% include "partials/contact_form_fields.html" %}
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 text-sm">Save Changes</button>
      <a href="/contacts/{{ contact.id }}" class="px-6 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-50">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
